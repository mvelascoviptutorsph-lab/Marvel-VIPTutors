  --panel-2:#FBFBFC;

  --border:#E7E9EE;
  --border-2:#EEF0F3;
  --ink-900:#14141F;
  --ink-700:#374151;
  --ink-600:#4B5563;
  --ink-500:#6B7280;
  --ink-400:#9CA3AF;
  --ink-300:#CBD0D8;
  --brand-700:#B95608;
  --brand-600:#EA6A0A;
  --brand-500:#F97316;
  --brand-100:#FFE7D1;
  --brand-50:#FFF4EA;
  --success:#16A34A;
  --success-fg:#15803D;
  --success-bg:#E9F7EE;
  --shadow:0 1px 2px rgba(20,20,31,.05);
  --shadow-md:0 6px 20px rgba(20,20,31,.08);
  --radius:14px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  background:var(--bg);
  color:var(--ink-900);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;

}
h1,h2,h3,.head{ font-family:"Plus Jakarta Sans",Inter,sans-serif; }
button{ font-family:inherit; cursor:pointer; }
a{ color:inherit; text-decoration:none; }
.ic{ width:16px; height:16px; flex:none; }
.tnum{ font-variant-numeric:tabular-nums; }

/* ---------- Public top navigation ---------- */
.topnav{
  position:sticky; top:0; z-index:30;
  height:62px; background:var(--panel); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 28px;
}
.logo{ font-family:"Plus Jakarta Sans"; font-weight:800; font-size:19px; letter-spacing:-.01em; }
.logo .dot{ color:var(--brand-500); }
.logo .co{ color:var(--ink-400); font-weight:700; font-size:14px; }
.nav-links{ flex:1; display:flex; justify-content:center; gap:30px; }
.nav-links a{ font-size:14px; font-weight:500; color:var(--ink-600); }
.nav-links a:hover{ color:var(--ink-900); }
.nav-links a.active{ color:var(--brand-600); font-weight:600; }
.nav-cta{ display:flex; align-items:center; gap:16px; }
.nav-cta .login{ font-size:14px; font-weight:600; color:var(--ink-700); }

.btn-signup{ font-size:13.5px; font-weight:700; color:var(--brand-600); border:1.5px solid var(--brand-500); background:#fff; padding:8px 16px; border-radius:10px; }

/* ---------- Organization sub-bar ---------- */
.orgbar{ background:var(--panel); border-bottom:1px solid var(--border); }
.orgbar-inner{ max-width:1180px; margin:0 auto; padding:11px 28px; display:flex; align-items:center; gap:18px; }
.back{ display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--ink-600); }
.back:hover{ color:var(--ink-900); }
.orgbar .divider{ width:1px; height:22px; background:var(--border); }
.orgbar .org-id{ display:flex; align-items:center; gap:9px; min-width:0; }

.orgbar .org-id .nm{ font-family:"Plus Jakarta Sans"; font-weight:700; font-size:14px; }
.orgbar .tabs{ margin-left:auto; display:flex; gap:4px; }
.orgbar .tab{ font-size:13px; font-weight:600; color:var(--ink-500); padding:7px 14px; border-radius:9px; }
.orgbar .tab:hover{ background:var(--panel-3); color:var(--ink-900); }
.orgbar .tab.active{ background:var(--brand-50); color:var(--brand-600); }

/* ---------- Layout ---------- */
.wrap{ max-width:1180px; margin:0 auto; padding:24px 28px 64px; }
.layout{ display:grid; grid-template-columns:328px minmax(0,1fr); gap:22px; align-items:start; }

/* ---------- Member list (left) ---------- */
.roster{
  position:sticky; top:82px;
  display:flex; flex-direction:column; gap:12px;
  max-height:calc(100vh - 104px); overflow-y:auto;
  padding-right:2px;
}
.member{
  display:flex; align-items:center; gap:13px;
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:13px 15px; text-align:left; width:100%;
  transition:border-color .14s, box-shadow .14s, background .14s;
}
.member:hover{ border-color:var(--ink-300); }
.member.active{ border-color:var(--brand-500); background:var(--brand-50); box-shadow:0 0 0 3px rgba(249,115,22,.12); }
.member:focus-visible{ outline:none; box-shadow:0 0 0 3px rgba(249,115,22,.30); }
.m-ava{
  position:relative; flex:none; width:46px; height:46px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:"Plus Jakarta Sans"; font-weight:700; font-size:17px;
}
.m-ava .dot{ position:absolute; right:0; bottom:0; width:12px; height:12px; border-radius:50%; border:2.5px solid var(--panel); background:var(--ink-300); }
.member.active .m-ava .dot{ border-color:var(--brand-50); }

.m-main{ flex:1; min-width:0; }
.m-name{ display:flex; align-items:center; gap:6px; font-weight:600; font-size:14px; color:var(--ink-900); }

.m-crown{ width:13px; height:13px; color:var(--brand-500); flex:none; }
.m-role{ font-size:12.5px; color:var(--ink-600); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.m-loc{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-400); margin-top:5px; }
.m-loc .ic{ width:12px; height:12px; }
.m-chev{ color:var(--ink-300); flex:none; }
.member.active .m-chev{ color:var(--brand-500); }

/* ---------- Profile (right) ---------- */

.p-head{ display:flex; align-items:flex-start; gap:18px; padding:4px 2px 20px; }
.p-ava{

.p-id{ flex:1; min-width:0; padding-top:2px; }
.p-name-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.p-name{ font-family:"Plus Jakarta Sans"; font-weight:800; font-size:24px; letter-spacing:-.02em; }
.badge-online{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; color:var(--success-fg); background:var(--success-bg); padding:3px 9px; border-radius:999px; }

.p-msg{ flex:none; }

.r-list li::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--ink-300); margin-top:7px; flex:none; }

/* Organization info */
.org-grid{ display:grid; grid-template-columns:1.25fr 1fr; gap:26px; }
.org-brand{ display:flex; gap:14px; }
.org-brand .mk{ width:52px; height:52px; border-radius:12px; background:var(--brand-100); color:var(--brand-600); display:flex; align-items:center; justify-content:center; font-family:"Plus Jakarta Sans"; font-weight:800; font-size:20px; flex:none; }
.org-brand .o-name{ font-family:"Plus Jakarta Sans"; font-weight:800; font-size:16px; }

.org-desc{ font-size:13px; color:var(--ink-600); line-height:1.6; margin-top:12px; }
.org-facts{ display:flex; flex-direction:column; gap:13px; }
.org-facts .item{ display:flex; gap:11px; align-items:flex-start; font-size:13px; }
.org-facts .item .ic{ width:16px; height:16px; color:var(--ink-400); margin-top:1px; }
.org-facts .k{ font-size:11px; color:var(--ink-500); }
.org-facts .v{ font-size:13.5px; font-weight:600; color:var(--ink-900); margin-top:1px; }
.org-facts .v.open{ color:var(--success-fg); }

.swap{ animation:fade .22s ease; }
@keyframes fade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .swap{ animation:none; } }

@media (max-width:1080px){
  .layout{ grid-template-columns:280px minmax(0,1fr); gap:18px; }
}
@media (max-width:900px){
  .nav-links{ display:none; }
  .layout{ grid-template-columns:1fr; }
  .roster{ position:static; max-height:none; }
  .info-grid, .org-grid{ grid-template-columns:1fr; }
}

  'building-2':'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  'user-round':'<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  calendar:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  award:'<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',
  cake:'<path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/>'
};
function ic(name, cls){
  return `<svg class="ic ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[name]||''}</svg>`;
}

let activeId = TEAM[0].id;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Member list ---------- */
function renderRoster(){
  const box = document.getElementById('roster');
  box.innerHTML = TEAM.map(m => `
    <button class="member ${m.id===activeId?'active':''}" data-id="${m.id}" aria-pressed="${m.id===activeId}">
      <span class="m-ava" style="background:${m.bg};color:${m.fg}">${m.letter}<span class="dot ${m.online?'on':''}"></span></span>
      <span class="m-main">
        <span class="m-name"><span class="txt">${esc(m.name)}</span>${m.owner?ic('crown','m-crown'):''}</span>
        <span class="m-role">${esc(m.role)}</span>
        <span class="m-loc">${ic('map-pin')}${esc(m.location)}</span>
      </span>
      ${ic('chevron-right','m-chev')}
    </button>`).join('');
  box.querySelectorAll('.member').forEach(b => b.addEventListener('click', () => select(b.dataset.id)));
}

/* ---------- Profile ---------- */
function eduRow(e){
  return `<div class="row">
    <span class="r-ic">${ic('graduation-cap')}</span>
    <div class="r-main">
      <div class="r-top"><span class="r-title">${esc(e.inst)}${e.level?` · <span class="lvl">${esc(e.level)}</span>`:''}</span><span class="r-when">${esc(e.years)}</span></div>
      <div class="r-sub">${esc(e.degree)}</div>
      ${e.note?`<div class="r-note">${esc(e.note)}</div>`:''}
    </div>
  </div>`;
}
function workRow(w){
  return `<div class="row">
    <span class="r-ic">${ic('briefcase')}</span>
    <div class="r-main">
      <div class="r-top"><span class="r-title">${esc(w.title)}</span><span class="r-when">${esc(w.dates)}</span></div>
      <div class="r-sub">${esc(w.org)}</div>
      <ul class="r-list">${w.bullets.map(b=>`<li><span>${esc(b)}</span></li>`).join('')}</ul>
    </div>
  </div>`;
}
function infoItem(icon, k, v){
  return `<div class="info-item">${ic(icon)}<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></div>`;
}
function renderDetail(){
  const m = TEAM.find(x => x.id === activeId);
  const online = m.online
    ? `<span class="badge-online"><span class="d"></span>Online now</span>`
    : '';
  document.getElementById('detail').innerHTML = `
  <div class="swap">
    <!-- header (no hero) -->
    <div class="p-head">
      <div class="p-ava" style="background:${m.bg};color:${m.fg}">${m.letter}<span class="dot ${m.online?'on':''}"></span></div>
      <div class="p-id">
        <div class="p-name-row">
          <span class="p-name">${esc(m.name)}</span>
          ${online}
          ${m.owner?`<span class="tag owner">${ic('crown')}Owner</span>`:''}
        </div>
        <div class="p-role">${esc(m.role)}</div>
        <div class="p-meta">
          <span>${ic('map-pin')}${esc(m.location)}</span>
          <span class="org">${ic('building-2')}<b>EDLAB</b> · Member since ${esc(m.since)}</span>
        </div>
        <div class="p-tagline">${esc(m.tagline)}</div>
      </div>
      <button class="btn btn-primary p-msg">${ic('send')}Send Message</button>
    </div>

    <div class="stack">
      <div class="card">
        <div class="card-h">${ic('info')}<span class="l">Professional summary</span></div>
        <div class="card-b"><p class="summary">${esc(m.bio)}</p></div>
      </div>

      <div class="card">
        <div class="card-h">${ic('user-round')}<span class="l">More info</span></div>
        <div class="card-b">
          <div class="info-grid">
            ${infoItem('cake','Age', m.age)}
            ${infoItem('user-round','Gender', m.gender)}
            ${infoItem('globe','Country', m.country)}
            ${infoItem('clock','Timezone', m.timezone)}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-h">${ic('graduation-cap')}<span class="l">Education &amp; Credentials</span></div>
        <div class="card-b">${m.edu.map(eduRow).join('')}</div>
      </div>

      <div class="card">
        <div class="card-h">${ic('briefcase')}<span class="l">Work &amp; Leadership Experience</span></div>
        <div class="card-b">${m.work.map(workRow).join('')}</div>
      </div>

      <div class="card">
        <div class="card-h">${ic('building-2')}<span class="l">Organization Info</span></div>
        <div class="card-b">
          <div class="org-grid">
            <div>
              <div class="org-brand">
                <div class="mk">${ORG.letter}</div>
                <div>
                  <div class="o-name">${esc(ORG.name)}</div>
                  <div class="o-meta">
                    <span>${ic('globe')}${esc(ORG.region)}</span>
                    <span>${ic('calendar')}Established ${esc(ORG.established)}</span>
                  </div>
                </div>
              </div>
              <p class="org-desc">${esc(ORG.desc)}</p>
            </div>
            <div class="org-facts">
              <div class="item">${ic('clock')}<div><div class="k">Status</div><div class="v open">${esc(ORG.status)} · <span style="color:var(--ink-500);font-weight:500">${esc(ORG.closes)}</span></div></div></div>
              <div class="item">${ic('clock')}<div><div class="k">Office hours</div><div class="v">${esc(ORG.hours)}</div></div></div>
              <div class="item">${ic('map-pin')}<div><div class="k">Address</div><div class="v">${esc(ORG.address)}</div></div></div>
              <div class="item">${ic('globe')}<div><div class="k">Website</div><div class="v">${esc(ORG.website)}</div></div></div>
              <div class="item">${ic('mail')}<div><div class="k">Email</div><div class="v">${esc(ORG.email)}</div></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
  window.scrollTo({ top:0, behavior:'smooth' });
}

function select(id){
  if(id === activeId) return;
  activeId = id;
  renderRoster();
  renderDetail();
}

/* keyboard: up/down through the roster */
document.addEventListener('keydown', e => {
  if(e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const ids = TEAM.map(m => m.id);
  const i = ids.indexOf(activeId);
  const next = e.key === 'ArrowDown' ? ids[Math.min(i+1, ids.length-1)] : ids[Math.max(i-1, 0)];
  if(next && next !== activeId){ e.preventDefault(); select(next); }
});

renderRoster();
renderDetail();
</script>
